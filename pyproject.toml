[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medspada"
version = "0.1.0"
description = "Spatial-depth adaptation of SAM3 for text-prompted medical volume segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.7", "torchvision>=0.22", "numpy>=1.26,<2",
  "Pillow>=10", "PyYAML>=6", "pycocotools>=2.0.7"
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.urls]
Repository = "https://github.com/ivel-Li/MedSpaDA"
Issues = "https://github.com/ivel-Li/MedSpaDA/issues"

[tool.setuptools.packages.find]
include = ["medspada*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
